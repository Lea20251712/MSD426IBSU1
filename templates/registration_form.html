<!DOCTYPE html>
<html>
<head>
    <title>New Registration - Warrigal Park FC</title>
</head>
<body>
    <h1>New Member Registration</h1>

    {% if error %}
        <p role="alert">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label>Member name:
            <input type="text" name="member_name" required>
        </label><br><br>

        <label>Date of birth:
            <input type="date" name="date_of_birth" required>
        </label><br><br>

        <label>Season:
            <input type="text" name="season" placeholder="2026" required>
        </label><br><br>

        <label>Age group:
            <input type="text" name="age_group" placeholder="U13" required>
        </label><br><br>

        <label>Guardian (required for members under 18):
            <select name="guardian_id">
                <option value="">-- Select an existing guardian --</option>
                {% for guardian in guardians %}
                    <option value="{{ guardian.id }}">
                        {{ guardian.name }}{% if guardian.mobile %} ({{ guardian.mobile }}){% endif %}
                    </option>
                {% endfor %}
            </select>
        </label><br><br>

        {% if not guardians %}
            <p>No guardians exist yet.
                <a href="{{ url_for('new_guardian') }}">Add a guardian first</a>.</p>
        {% endif %}

        <button type="submit">Register</button>

    </form>
</body>
</html>
